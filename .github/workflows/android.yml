name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (pure Kotlin, no Android SDK)
        run: ./gradlew -p core test

      - name: Render UI screenshots (shared screens on Compose Desktop)
        run: ./gradlew -p tools/ui-preview render

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: tools/ui-preview/build/screens/*.png
          if-no-files-found: error

      - name: Install host test tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark ninja-build python3-venv
          # aioquic needs a newer cryptography than the Debian package pip cannot replace
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q aioquic

      - name: Native engine end-to-end test (real TUN device, Linux host)
        run: sudo WORK="$RUNNER_TEMP/hosttest" PYTHON="$RUNNER_TEMP/venv/bin/python" tools/host-test/run.sh

      - name: Flows match tshark conversations, nDPI classification
        run: tools/host-test/validate.sh "$RUNNER_TEMP/hosttest" "$RUNNER_TEMP/flow-report"

      # docs/PERFORMANCE.md: the numbers are uploaded; the checks are about correctness
      # (connections survive), since the speed of shared runners varies.
      - name: Engine benchmark (real TUN device)
        run: |
          mkdir -p build/perf
          sudo WORK="$RUNNER_TEMP/hosttest" tools/host-test/bench.sh build/perf/engine.json
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("build/perf/engine.json"))
          failures = [k for k, ok in {
              "open connections reset": r["open_connections_alive"].split("/")[0] == r["open_connections_alive"].split("/")[1],
              "idle connection reset": r["idle_connection_alive_after_s"] is not None,
          }.items() if not ok]
          print("\n".join(failures))
          sys.exit(1 if failures else 0)
          EOF

      - name: Kotlin pipeline benchmark (JVM)
        run: ./gradlew -p core benchmark --args="$PWD/app/src/main/assets/enrichment $PWD/build/perf/jvm.json"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-host
          path: build/perf/*.json
          if-no-files-found: error

      - name: Build debug APK and run lint
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: traffic-al-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  # The encrypted storage (Android Keystore, Tink, SQLCipher) on a real Android 10 system.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an Android 10 (API 29) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Then the whole app: downloads through the real VPN (docs/PERFORMANCE.md).
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            mkdir -p build/perf && python3 tools/emulator/bench.py app/build/outputs/apk/debug/app-debug.apk build/perf/emulator.json

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            build/perf/emulator.json
          if-no-files-found: ignore
